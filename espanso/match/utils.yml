matches:
  # Simple text replacement
  - trigger: "##cppdt"
    label: "cpp-normal-datatype-color"
    replace: "#569cd6"

  - trigger: "##cpptdt"
    label: "cpp-typedef-datatype-color"
    replace: "#4ec9b0"

  - trigger: "##cppkw"
    label: "cpp-keyword-color"
    replace: "#c586c0"
  
  - trigger: "##cppstr"
    label: "cpp-string-color"
    replace: "#ce9178"
  
  - trigger: "##comment"
    label: "code-comment-color"
    replace: "#6a9955"

  - trigger: "##codetxt"
    label: "code-text-color"
    replace: "#cccccc"

  - trigger: "##codenum"
    label: "code-number-color"
    replace: "#b5cea8"

  - trigger: "##codefunc"
    label: "code-function-color"
    replace: "#dcdcaa"

  - trigger: "##codevar"
    label: "code-variable-color"
    replace: "#9cdcfe"

  # HTML additional snippets

  - trigger: "::table"
    label: "HTML - table"
    replace: >
      <table>
        <tr>
          <td>foo</td>
          <td>bar</td>
          <td>foo</td>
        </tr>
        <tr>
          <td>foo</td>
          <td>bar</td>
          <td>baz</td>
        </tr>
      </table>
  
  - trigger: "::span"
    label: "HTML - span"
    replace: "<span>$|$</span>"

  - trigger: "::bold"
    label: "HTML - bold - strong - format"
    replace: "<b>$|$</b>"

  - trigger: "::italic"
    label: "HTML - italic - format"
    replace: "<i>$|$</i>"

  - trigger: "::underline"
    label: "HTML - underline - format"
    replace: "<u>$|$</u>"

  - trigger: "::strong"
    label: "HTML - strong - bold - format"
    replace: "<strong>$|$</strong>"
  

  - trigger: "::mark"
    label: "HTML - mark - highlight - format"
    replace: "<mark>$|$</mark>"
  
  - trigger: "::em"
    label: "HTML - emphasized - format"
    replace: "<em>$|$</em>"
  
  - trigger: "::del"
    label: "HTML - deleted - dashed - format"
    replace: "<del>$|$</del>"

  - trigger: "::ins"
    label: "HTML - inserted - underlined - format"
    replace: "<ins>$|$</ins>"

  - trigger: "::sub"
    label: "HTML - subscript - format"
    replace: "<sub>$|$</sub>"

  - trigger: "::sup"
    label: "HTML - superscript - format"
    replace: "<sup>$|$</sup>"
